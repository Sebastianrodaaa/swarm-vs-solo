name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run mock benchmark (solo)
        run: svs run --tasks builtin --mode solo --agent mock --limit 5 --results results/runs.jsonl
      - name: Run mock benchmark (swarm)
        run: svs run --tasks builtin --mode swarm --agent mock --limit 5 --results results/runs.jsonl
      - name: Run mock harness arms (fixed + coevolve)
        run: |
          svs run --tasks builtin --mode solo --agent mock --limit 6 --harness fixed --results results/runs.jsonl
          svs run --tasks builtin --mode solo --agent mock --limit 6 --harness coevolve --batch-size 2 --run-dir results/coevolve-run --results results/runs.jsonl
      - name: Generate report
        run: svs report --results results/runs.jsonl --output results/report
      - name: Pytest
        run: pytest -q
